services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  mcp_server:
    build: ./mcp_server
    env_file: .env
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mcp_server:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  # Eseguito su richiesta: docker compose --profile ingestion run --rm ingestion
  ingestion:
    build: ./ingestion
    env_file: .env
    profiles: ["ingestion"]
    depends_on:
      - qdrant
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  qdrant_storage:
